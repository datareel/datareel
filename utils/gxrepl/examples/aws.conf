# gxrepl server config for AWS (aws-git, ip-172-31-46-68): it listens and answers the workstation, which
# drives every set. ~/.config/gxrepl/gxrepl.conf on AWS. No secrets: the TLS key comes from the EPDB
# (drsecrets group gxrepl-aws, opened with the KMS host key) on a pipe, through automate/gxrepl.sh.

node = aws-osa
role = server

# Direct: listen on 2073 (open to all: the workstation's address is dynamic). Behind the SSH tunnel:
# listen = 127.0.0.1:2073
listen = 0.0.0.0:2073
# Clients that passed the certificate checks, and TLS handshakes running at once with their time
# limit, so silent connections from scanners cannot keep the workstation out
max_clients = 2
max_handshakes = 16
handshake_timeout = 10

# Only the workstation's certificate is let in: its CN, and its pinned SHA-256 fingerprint
# (gxrepl fingerprint ~/.config/gxrepl/pki/workstation.pem, after gxrepl_certs.sh make)
allow_cn = drworkstation2
# allow_fingerprint = AB:CD:...

cert = ${HOME}/.config/gxrepl/pki/aws.pem
ca   = ${HOME}/.config/gxrepl/pki/ca.pem
status_file = /home4/open_source_projects/datareel/osa_data/var/gxrepl/status.json
timeout = 120
compress = yes

# ---------------- Database sets ----------------
# gxrepl carries DataReel databases only (.gxd, .btx, and each folder's "include" files). Every flat
# file in osa_data stays with DRCM's two-way rsync (sync_osa.sh), whose list excludes exactly these
# folders: RsyncExclude "/db/realtime/", "/db/patterns/", "/db/news_learn/", "/db/news/oodb/" (and "/var/", already).
# Hidden publish leftovers (.patterns.tmp-old-...) are never copied. The workstation writes all of
# them; on a fail over AWS writes them, and failback pulls them back (see the cutover notes).
#
# Split-brain guard: each node checks its own trader manager lock (an flock while it runs); a held
# lock refuses changes to that node's copy. Paths are relative to the set root.

# Closed realtime days, published by osa_ingest (one folder per day, swapped in by a rename)
[set db_realtime]
root = /home4/open_source_projects/datareel/osa_data/db/realtime
accept = target
include = commit.bin
writer_lock = ../../var/osa_sip_trader_manager/paper/manager.lock, ../../var/osa_sip_trader_manager/live/manager.lock

# The patterns OODB, published by osa_pattern_ingest
[set db_patterns]
root = /home4/open_source_projects/datareel/osa_data/db/patterns
accept = target
include = commit.bin, sources.json
writer_lock = ../../var/osa_sip_trader_manager/paper/manager.lock, ../../var/osa_sip_trader_manager/live/manager.lock

# The news learning OODB, published by osa_learn_ingest, with its nightly text exports
[set db_news_learn]
root = /home4/open_source_projects/datareel/osa_data/db/news_learn
accept = target
include = commit.bin, sources.json, export/*.gz
writer_lock = ../../var/osa_sip_trader_manager/paper/manager.lock, ../../var/osa_sip_trader_manager/live/manager.lock

# The news object database's published days (osa_news_db --nightly), empty until its first publish
[set db_news_oodb]
root = /home4/open_source_projects/datareel/osa_data/db/news/oodb
accept = target
include = commit.bin
writer_lock = ../../../var/osa_sip_trader_manager/paper/manager.lock, ../../../var/osa_sip_trader_manager/live/manager.lock

